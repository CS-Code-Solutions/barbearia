<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Barbearia</title>
    <link rel="icon" type="image/png" href="gomes.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }

        #admin-panel {
            display: block; /* Aberto diretamente sem ecrã de login */
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-live {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        .btn-live:hover {
            background-color: #218838;
        }
        .admin-section {
            background: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .admin-section h3 {
            margin-top: 0;
            color: #1a1a1a;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 8px;
        }
        form input, form textarea, form select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-submit {
            background-color: #1a1a1a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #d4af37;
            color: #1a1a1a;
        }
    </style>
</head>
<body>

    <!-- PAINEL ADMINISTRATIVO DIRETO -->
    <div id="admin-panel">
        <div class="admin-header">
            <div style="display:flex; align-items:center; gap:12px;">
                <img src="logo.png" alt="Logo" style="width:35px; height:35px; border-radius:50%; object-fit:cover; border:1.5px solid #d4af37;" onerror="this.style.display='none'">
                <h2 id="admin-welcome-title" style="margin:0; font-size:1.2rem;">Painel da Barbearia</h2>
            </div>
            <div class="header-actions">
                <a href="live.html" target="_blank" class="btn-live">🖥️ Abrir Agenda em Tempo Real (Tela PC)</a>
            </div>
        </div>

        <!-- CADASTRO DE UTILIZADORES / BARBEIROS E PERMISSÕES -->
        <div class="admin-section" id="section-barbeiros">
            <h3>Gerir Utilizadores / Barbeiros Autorizados</h3>
            <form id="barber-form">
                <input type="text" id="barber-nome" placeholder="Nome Completo" required>
                <input type="email" id="barber-email" placeholder="E-mail de Contato" required>
                <select id="barber-perfil" required style="width:100%; padding:10px; margin:6px 0 12px 0; border:1px solid #ccc; border-radius:4px;">
                    <option value="barbeiro">Barbeiro (Restrito)</option>
                    <option value="admin">Administrador (Acesso Total)</option>
                </select>
                <label style="display:block; margin:10px 0; font-size:0.9rem; cursor:pointer;">
                    <input type="checkbox" id="barber-pode-editar" checked> Permitir edição de horários agendados
                </label>
                <button type="submit" class="btn-submit">Salvar Utilizador Autorizado</button>
            </form>
            <div id="admin-barbers-list" style="margin-top: 15px;">A carregar utilizadores...</div>
        </div>

        <!-- CADASTRO DE SERVIÇOS (COM IMAGEM, VALOR E TEMPO DO CARROSSEL) -->
        <div class="admin-section">
            <h3>Gerir Serviços (Carrossel Interativo)</h3>
            <form id="service-form">
                <input type="text" id="serv-nome" placeholder="Nome do Serviço" required>
                <input type="url" id="serv-img" placeholder="URL da Imagem do Serviço" required>
                <input type="text" id="serv-preco" placeholder="Valor (Ex: 40.00)" required>
                <textarea id="serv-desc" placeholder="Descrição detalhada do serviço" rows="3" required></textarea>
                <label style="font-size:0.9rem; font-weight:bold; display:block; margin-top:10px;">Tempo de transição automática do carrossel (em segundos):</label>
                <input type="number" id="serv-tempo" placeholder="Ex: 4 (Padrão: 4 segundos)" value="4" min="1" required>
                <button type="submit" class="btn-submit">Adicionar Serviço</button>
            </form>
            <div id="admin-services-list" style="margin-top: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;"></div>
        </div>

        <!-- CADASTRO DE PARCEIROS E VÍDEOS -->
        <div class="admin-section">
            <h3>Gerir Parceiros e Vídeos</h3>
            <form id="partner-form">
                <input type="text" id="part-nome" placeholder="Nome do Parceiro" required>
                <input type="url" id="part-logo" placeholder="URL do Logótipo / Imagem" required>
                <input type="url" id="part-video" placeholder="URL de Vídeo (Opcional - Link Embed do YouTube)">
                <button type="submit" class="btn-submit">Adicionar Parceiro</button>
            </form>
            <div id="admin-partners-list" style="margin-top: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;"></div>
        </div>

        <!-- CADASTRO DE DESTAQUES -->
        <div class="admin-section">
            <h3>Gerir Destaques</h3>
            <form id="highlight-form">
                <input type="text" id="high-titulo" placeholder="Título do Destaque" required>
                <input type="url" id="high-img" placeholder="URL da Imagem do Destaque" required>
                <textarea id="high-desc" placeholder="Descrição curta do destaque" rows="3" required></textarea>
                <button type="submit" class="btn-submit">Adicionar Destaque</button>
            </form>
            <div id="admin-highlights-list" style="margin-top: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;"></div>
        </div>

        <!-- AGENDAMENTOS -->
        <div class="admin-section">
            <h3>Agendamentos Confirmados (Gestão e Edição)</h3>
            <div id="admin-appointments-list">A carregar agendamentos...</div>
        </div>
    </div>

    <!-- Script Admin atualizado para carregar sem restrição de autenticação -->
    <script type="module" src="js/admin.js"></script>
</body>
</html>
