<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda em Tempo Real - Barbearia Gomes</title>
    <link rel="icon" type="image/png" href="gomes.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        header h1 {
            color: #d4af37;
            margin: 0;
            font-family: Georgia, serif;
            font-size: 2.5rem;
        }
        .live-clock {
            font-size: 1.4rem;
            color: #fff;
            background: #141414;
            border: 1px solid #333;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .live-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .live-card {
            background: #141414;
            border-left: 5px solid #d4af37;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #222;
            position: relative;
        }
        .live-card h3 {
            margin-top: 0;
            color: #d4af37;
            font-size: 1.2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .live-card p {
            margin: 8px 0;
            font-size: 0.95rem;
            color: #ccc;
        }
        .live-card strong {
            color: #fff;
        }
        .badge-atendimento {
            display: inline-block;
            background: #ffc107;
            color: #1a1a1a;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .empty-msg {
            text-align: center;
            color: #666;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Agenda em Tempo Real</h1>
        <p style="color: #888; margin-top: 5px;">Acompanhamento de horários da barbearia</p>
        <div id="live-clock" class="live-clock">A carregar relógio...</div>
    </header>

    <div id="live-appointments-container" class="live-grid">
        <p class="empty-msg">A carregar agendamentos em tempo real...</p>
    </div>

    <script>
        // Relógio em Tempo Real
        function atualizarRelogio() {
            const agora = new Date();
            const options = { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' };
            const dataStr = agora.toLocaleDateString('pt-BR', options);
            const horaStr = agora.toLocaleTimeString('pt-BR');
            
            const relogioElemento = document.getElementById("live-clock");
            if (relogioElemento) {
                relogioElemento.textContent = `🕒 ${dataStr} - ${horaStr}`;
            }
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();
    </script>

    <script type="module">
        import { db } from "./js/firebase-init.js";
        import { collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const container = document.getElementById("live-appointments-container");
        let servicosCache = {};
        let ultimosAgendamentosSnapshot = [];

        async function carregarCacheServicos() {
            try {
                const snap = await getDocs(collection(db, "servicos"));
                snap.forEach(d => {
                    servicosCache[d.id] = d.data();
                });
            } catch (e) {
                console.error("Erro ao carregar serviços para cache:", e);
            }
        }

        function minutosParaTempo(minTotal) {
            const h = Math.floor(minTotal / 60);
            const m = minTotal % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function tempoParaMinutos(horaStr) {
            const [h, m] = horaStr.split(':').map(Number);
            return h * 60 + m;
        }

        function renderizarAgendamentosAtivos() {
            if (!container) return;
            container.innerHTML = "";

            if (ultimosAgendamentosSnapshot.length === 0) {
                container.innerHTML = '<p class="empty-msg">Nenhum agendamento registado no momento.</p>';
                return;
            }

            const agora = new Date().getTime();
            let ativos = [];

            ultimosAgendamentosSnapshot.forEach((a) => {
                if (a.status === "Cancelado") return;

                const dataHoraOriginal = a.dataHora || '';
                if (!dataHoraOriginal) return;

                let duracaoMin = 30;
                const listaServicos = a.servicosIds || (a.servicoId ? [a.servicoId] : []);
                if (listaServicos.length > 0) {
                    duracaoMin = 0;
                    listaServicos.forEach(sId => {
                        if (servicosCache[sId]) {
                            duracaoMin += Number(servicosCache[sId].duracaoMinutos) || 30;
                        }
                    });
                }
                if (duracaoMin === 0) duracaoMin = Number(a.duracaoTotal) || 30;

                const [dataYMD, horaInicio] = dataHoraOriginal.split('T');
                if (!dataYMD || !horaInicio) return;

                const inicioMin = tempoParaMinutos(horaInicio);
                const fimMin = inicioMin + duracaoMin;
                const horaFim = minutosParaTempo(fimMin);

                const inicioMs = new Date(dataHoraOriginal).getTime();
                const fimMs = inicioMs + (duracaoMin * 60000);

                // Ocultar automaticamente se o horário final já passou
                if (agora > fimMs) return;

                let statusBadge = "";
                if (agora >= inicioMs && agora <= fimMs) {
                    statusBadge = `<span class="badge-atendimento">EM ATENDIMENTO</span><br>`;
                }

                let servicosTexto = a.nomesServicos || 'Serviço Padrão';
                servicosTexto = servicosTexto.replace(/,\s*/g, ' + ');

                ativos.push({
                    dataYMD,
                    horaInicio,
                    horaFim,
                    clienteNome: a.clienteNome || 'Cliente',
                    clienteTelefone: a.clienteTelefone || 'N/A',
                    barbeiroNome: a.barbeiroNome || 'Qualquer Barbeiro',
                    servicosTexto,
                    duracaoMin,
                    statusBadge
                });
            });

            if (ativos.length === 0) {
                container.innerHTML = '<p class="empty-msg">Nenhum agendamento ativo no momento.</p>';
                return;
            }

            ativos.forEach(a => {
                const [ano, mes, dia] = a.dataYMD.split('-');
                const dataFormatada = `${dia}/${mes}/${ano}`;

                container.innerHTML += `
                    <div class="live-card">
                        ${a.statusBadge}
                        <h3>${dataFormatada} · ${a.horaInicio} às ${a.horaFim}</h3>
                        <p><strong>Cliente:</strong> ${a.clienteNome}</p>
                        <p><strong>Telefone:</strong> ${a.clienteTelefone}</p>
                        <p><strong>Barbeiro:</strong> ${a.barbeiroNome}</p>
                        <p><strong>Serviço(s):</strong> ${a.servicosTexto} (${a.duracaoMin} min)</p>
                    </div>
                `;
            });
        }

        async function iniciarTempoReal() {
            await carregarCacheServicos();

            onSnapshot(collection(db, "agendamentos"), (snapshot) => {
                ultimosAgendamentosSnapshot = [];
                snapshot.forEach((docItem) => {
                    ultimosAgendamentosSnapshot.push(docItem.data());
                });
                renderizarAgendamentosAtivos();
            });

            // Reavaliar o término dos atendimentos a cada 10 segundos automaticamente
            setInterval(renderizarAgendamentosAtivos, 10000);
        }

        iniciarTempoReal();
    </script>
</body>
</html>
