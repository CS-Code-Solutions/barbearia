<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Barbearia</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h2>Área Restrita - Barbearia</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="E-mail" required>
                <input type="password" id="login-password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <!-- Painel Principal (Oculto até logar) -->
    <div id="admin-dashboard" class="screen" style="display: none;">
        <header>
            <h1>Gestão da Barbearia</h1>
            <button id="logout-btn">Sair</button>
        </header>

        <main>
            <section class="admin-section">
                <h2>Adicionar Agendamento Manual</h2>
                <form id="manual-booking-form">
                    <input type="text" id="client-name" placeholder="Nome do Cliente" required>
                    <input type="tel" id="client-phone" placeholder="Telefone" required>
                    <select id="service-select" required>
                        <!-- Preenchido via JavaScript -->
                    </select>
                    <input type="datetime-local" id="booking-date" required>
                    
                    <!-- Campo de Origem pedido por você -->
                    <select id="booking-origin" required>
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Telefone">Telefone</option>
                        <option value="Presencial">Presencial</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Site">Site</option>
                    </select>
                    
                    <button type="submit">Salvar Agendamento</button>
                </form>
            </section>

            <section class="admin-section">
                <h2>Agenda em Tempo Real</h2>
                <div id="appointments-list">
                    <!-- Os agendamentos do Firestore aparecem aqui em tempo real -->
                </div>
            </section>
        </main>
    </div>

    <!-- Script principal do Admin (Modular) -->
    <script type="module" src="js/admin.js"></script>
</body>
</html>
