<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Barbearia</title>
    <link rel="icon" type="image/png" href="Ico.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }
        /* Tela de Login Centralizada */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), #1a1a1a;
        }
                .login-card img {
            width: 80px;
            height: 80px;
            border-radius: 0; /* Removido o recorte circular */
            border: none;     /* Removida a borda dourada */
            object-fit: contain;
            margin-bottom: 15px;
            background: transparent;
        }

        .login-card img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
            margin-bottom: 15px;
            background-color: #333;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .login-card button {
            background-color: #1a1a1a;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .login-card button:hover {
            background-color: #d4af37;
            color: #1a1a1a;
        }

        /* Painel Administrativo (Oculto até logar) */
        #admin-panel {
            display: none;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-logout:hover {
            background-color: #c82333;
        }
        .admin-section {
            background: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN PROFISSIONAL -->
    <div id="login-screen">
        <div class="login-card">
            <img src="Ico.png" alt="Logo Barbearia" onerror="this.style.display='none'">
            <h2>Área Restrita</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="E-mail do Administrador" required>
                <input type="password" id="login-password" placeholder="Senha" required>
                <button type="submit">Entrar no Painel</button>
            </form>
        </div>
    </div>

    <!-- PAINEL ADMINISTRATIVO -->
    <div id="admin-panel">
        <div class="admin-header">
            <h2>Painel da Barbearia</h2>
            <button id="logout-btn" class="btn-logout">Sair</button>
        </div>

        <div class="admin-section">
            <h3>Gerenciamento de Agendamentos e Cadastros</h3>
            <p>Bem-vindo ao painel administrativo. Aqui você pode gerenciar os serviços, ver agendamentos e configurar o sistema.</p>
        </div>
    </div>

    <!-- Script de autenticação e controle -->
    <script type="module" src="js/admin.js"></script>
</body>
</html>
