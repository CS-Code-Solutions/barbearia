<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Barbearia</title>
    <link rel="icon" type="image/png" href="gomes.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            margin: 0;
            padding: 0;
            color: #f4f4f4;
        }

        #admin-panel {
            display: block;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #222;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-live {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        .btn-live:hover {
            background-color: #218838;
        }
        .admin-section {
            background: #141414;
            padding: 20px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #222;
        }
        
        /* Botão Acordeão para o título da secção */
        .section-toggle-btn {
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 1.2rem;
            color: #f4f4f4;
            font-weight: bold;
            font-family: Georgia, serif;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 5px;
            border-bottom: 2px solid #d4af37;
        }
        .section-toggle-btn span {
            color: #d4af37;
            font-size: 1rem;
        }

        /* Conteúdo recolhível */
        .section-content {
            display: none;
            margin-top: 20px;
        }
        .section-content.active {
            display: block;
        }

        form input, form textarea, form select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        form input:focus, form select:focus, form textarea:focus {
            border-color: #d4af37;
            outline: none;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            cursor: pointer;
            font-size: 0.95rem;
            user-select: none;
            text-align: left;
            color: #ccc;
        }
        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }
        .btn-submit {
            background: linear-gradient(135deg, #e6c563 0%, #c59b27 100%);
            color: #0d0d0d;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div id="admin-panel">
        <div class="admin-header">
            <div style="display:flex; align-items:center; gap:12px;">
                <img src="logo.png" alt="Logo" style="width:35px; height:35px; border-radius:50%; object-fit:cover; border:1.5px solid #d4af37;" onerror="this.style.display='none'">
                <h2 id="admin-welcome-title" style="margin:0; font-size:1.2rem;">Painel da Barbearia</h2>
            </div>
            <div class="header-actions">
                <a href="live.html" target="_blank" class="btn-live">🖥️ Abrir Agenda em Tempo Real (Tela PC)</a>
            </div>
        </div>

        <!-- GERIR UTILIZADORES -->
        <div class="admin-section" id="section-barbeiros">
            <button class="section-toggle-btn" onclick="toggleSection('content-barbeiros')">
                Gerir Utilizadores / Barbeiros Autorizados <span>▼</span>
            </button>
            <div id="content-barbeiros" class="section-content">
                <form id="barber-form">
                    <input type="text" id="barber-nome" placeholder="Nome Completo" required>
                    <input type="email" id="barber-email" placeholder="E-mail de Contato" required>
                    <select id="barber-perfil" required style="width:100%; padding:10px; margin:6px 0 12px 0; border:1px solid #333; border-radius:8px; background:#1a1a1a; color:#fff;">
                        <option value="barbeiro">Barbeiro (Restrito)</option>
                        <option value="admin">Administrador (Acesso Total)</option>
                    </select>
                    
                    <label class="checkbox-container">
                        <input type="checkbox" id="barber-pode-editar" checked>
                        Permitir edição de horários agendados
                    </label>

                    <button type="submit" class="btn-submit">Salvar Utilizador Autorizado</button>
                </form>
                <div id="admin-barbers-list" style="margin-top: 15px;">A carregar utilizadores...</div>
            </div>
        </div>

        <!-- GERIR SERVIÇOS -->
        <div class="admin-section">
            <button class="section-toggle-btn" onclick="toggleSection('content-servicos')">
                Gerir Serviços (Carrossel Interativo) <span>▼</span>
            </button>
            <div id="content-servicos" class="section-content">
                <form id="service-form">
                    <input type="text" id="serv-nome" placeholder="Nome do Serviço" required>
                    
                    <label style="font-size:0.9rem; font-weight:bold; display:block; margin-top:5px; text-align:left; color:#aaa;">Imagem do Serviço:</label>
                    <input type="file" id="serv-img-file" accept="image/*" required>
                    
                    <input type="text" id="serv-preco" placeholder="Valor (Ex: 40.00)" required>
                    <textarea id="serv-desc" placeholder="Descrição detalhada do serviço" rows="3" required></textarea>
                    
                    <label style="font-size:0.9rem; font-weight:bold; display:block; margin-top:10px; text-align:left; color:#aaa;">Tempo de transição automática do carrossel (em segundos):</label>
                    <input type="number" id="serv-tempo" placeholder="Ex: 4 (Padrão: 4 segundos)" value="4" min="1" required>
                    
                    <button type="submit" class="btn-submit">Adicionar Serviço</button>
                </form>
                <div id="admin-services-list" style="margin-top: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;"></div>
            </div>
        </div>

        <!-- GERIR PARCEIROS -->
        <div class="admin-section">
            <button class="section-toggle-btn" onclick="toggleSection('content-parceiros')">
                Gerir Parceiros e Vídeos <span>▼</span>
            </button>
            <div id="content-parceiros" class="section-content">
                <form id="partner-form">
                    <input type="text" id="part-nome" placeholder="Nome do Parceiro" required>
                    
                    <label style="font-size:0.9rem; font-weight:bold; display:block; margin-top:5px; text-align:left; color:#aaa;">Logótipo / Imagem do Parceiro:</label>
                    <input type="file" id="part-logo-file" accept="image/*" required>
                    
                    <input type="url" id="part-video" placeholder="URL de Vídeo (Opcional - Link Embed do YouTube)">
                    <button type="submit" class="btn-submit">Adicionar Parceiro</button>
                </form>
                <div id="admin-partners-list" style="margin-top: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;"></div>
            </div>
        </div>

        <!-- GERIR DESTAQUES -->
        <div class="admin-section">
            <button class="section-toggle-btn" onclick="toggleSection('content-destaques')">
                Gerir Destaques <span>▼</span>
            </button>
            <div id="content-destaques" class="section-content">
                <form id="highlight-form">
                    <input type="text" id="high-titulo" placeholder="Título do Destaque" required>
                    
                    <label style="font-size:0.9rem; font-weight:bold; display:block; margin-top:5px; text-align:left; color:#aaa;">Imagem do Destaque:</label>
                    <input type="file" id="high-img-file" accept="image/*" required>
                    
                    <textarea id="high-desc" placeholder="Descrição curta do destaque" rows="3" required></textarea>
                    <button type="submit" class="btn-submit">Adicionar Destaque</button>
                </form>
                <div id="admin-highlights-list" style="margin-top: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;"></div>
            </div>
        </div>

        <!-- AGENDAMENTOS -->
        <div class="admin-section">
            <button class="section-toggle-btn" onclick="toggleSection('content-agendamentos')">
                Agendamentos Confirmados (Gestão e Edição) <span>▼</span>
            </button>
            <div id="content-agendamentos" class="section-content active">
                <div id="admin-appointments-list" style="margin-top: 15px;">A carregar agendamentos...</div>
            </div>
        </div>
    </div>

    <script>
        function toggleSection(contentId) {
            const content = document.getElementById(contentId);
            content.classList.toggle("active");
        }
    </script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
